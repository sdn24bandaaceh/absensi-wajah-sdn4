<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Absensi Wajah SDN 4 Banda Aceh</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- AOS Animation -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-color) 0%, #1a365d 100%);
      position: relative;
      overflow: hidden;
    }
    
    /* Animated Background Shapes */
    .shape {
      position: absolute;
      filter: blur(50px);
      z-index: 0;
      opacity: 0.6;
      animation: float 10s infinite ease-in-out alternate;
    }
    
    .shape-1 {
      top: -10%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: var(--info-color);
      border-radius: 50%;
    }
    
    .shape-2 {
      bottom: -10%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: var(--accent-color);
      border-radius: 50%;
      animation-delay: -5s;
    }
    
    .login-card {
      z-index: 1;
      width: 100%;
      max-width: 450px;
      padding: 3rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .login-card h2 {
      color: #FFFFFF;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    
    .login-card p {
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 2rem;
    }
    
    .form-floating input {
      background-color: rgba(255, 255, 255, 0.9);
      border: none;
    }
    
    .form-floating input:focus {
      background-color: #FFFFFF;
      box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.25);
    }
    
    .btn-login {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0.8rem;
      font-weight: 600;
      width: 100%;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    
    .btn-login:hover {
      background: #d97706;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
    }
    
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 30px) scale(1.1); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    
    <div class="glass-card login-card" data-aos="zoom-in">
      <!-- School Logo (Placeholder using Icon) -->
      <div class="mb-4">
        <i class="bi bi-shield-lock text-white" style="font-size: 3rem;"></i>
      </div>
      
      <h2>Absensi Wajah</h2>
      <p>SD Negeri 4 Banda Aceh</p>
      
      <form id="loginForm">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="username" placeholder="Username / NIP" required>
          <label for="username"><i class="bi bi-person me-2"></i>Username / NIP</label>
        </div>
        
        <div class="form-floating mb-4">
          <input type="password" class="form-control" id="password" placeholder="Password" required>
          <label for="password"><i class="bi bi-key me-2"></i>Password</label>
        </div>
        
        <button type="submit" class="btn btn-login hover-scale">
          LOGIN <i class="bi bi-box-arrow-in-right ms-2"></i>
        </button>
      </form>
      
      <div class="mt-4 text-white-50 small">
        &copy; 2026 SDN 4 Banda Aceh. Versi Enterprise.
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>
  
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
